tests:
  cuda:
    - name: vetnode
      kind: cuda-vetnode
    - name: async
      runner: cuda
      timeout: 2h
      script:
        - /opt/tests/verl/rl-async-benchmark.sh
      variables:
        SLURM_JOB_NUM_NODES: "4"
        SLURM_NTASKS: "4"
        CSCS_ADDITIONAL_MOUNTS: '["/tmp:/tmp"]'
