image = "jfrog.svc.cscs.ch/docker-group-csstaff/alps-images/apertus-2-megatron-cuda:alps7-dev-51b1a1ccf8d648c18d7adb3bda8e5d3b"

mounts = ["/capstor/", "/ritom/", "/iopsstor"]

writable = true
entrypoint = true

[env]
UCCL_EP_TRANSPORT = "cxi"
PMIX_MCA_psec = "native"
NCCL_PXN_DISABLE = "1"
NCCL_CROSS_NIC = "0"

[annotations]
com.hooks.cxi.enabled = "false"
com.hooks.netstack.source = "artifact"
