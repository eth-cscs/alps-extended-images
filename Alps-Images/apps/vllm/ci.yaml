tests:
  cuda:
    - name: vetnode
      kind: cuda-vetnode
    - name: model-imports
      runner: cuda
      timeout: 10m
      script:
        - /opt/tests/vllm/model_import_smoke.sh
    - name: ray-nccl-uccl-ep
      runner: cuda
      timeout: 30m
      script:
        - /opt/tests/vllm/ray_nccl_smoke.sh
      variables:
        SLURM_JOB_NUM_NODES: "2"
        SLURM_NTASKS: "2"
        VLLM_RAY_NCCL_WORLD_SIZE: "8"
        FI_CXI_ENABLE_WRITEDATA: "1"
    - name: mooncake-cxi
      runner: cuda
      timeout: 15m
      script:
        - /opt/tests/vllm/mooncake_smoke.sh
      variables:
        SLURM_JOB_NUM_NODES: "1"
        SLURM_NTASKS: "1"
  rocm:
    - name: model-imports
      runner: rocm
      timeout: 10m
      script:
        - /opt/tests/vllm/model_import_smoke.sh
    - name: ray-rccl-uccl-ep
      runner: rocm
      timeout: 30m
      script:
        - /opt/tests/vllm/ray_nccl_smoke.sh
      variables:
        SLURM_JOB_NUM_NODES: "2"
        SLURM_NTASKS: "2"
        VLLM_RAY_NCCL_WORLD_SIZE: "8"
        FI_CXI_ENABLE_WRITEDATA: "1"
    - name: mooncake-cxi
      runner: rocm
      timeout: 15m
      script:
        - /opt/tests/vllm/mooncake_smoke.sh
      variables:
        SLURM_JOB_NUM_NODES: "1"
        SLURM_NTASKS: "1"
