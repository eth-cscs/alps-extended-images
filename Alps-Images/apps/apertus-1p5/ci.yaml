tests:
  cuda:
    - name: vetnode
      kind: cuda-vetnode
    - name: pretrain
      runner: cuda
      timeout: 2h
      script:
        - /opt/tests/apertus-1p5/megatron_pretrain.sh
      variables:
        CI_FAST: "1"
        TP_CI: "1"
        PP_CI: "1"
        CHECKPOINT_STEPS_CI: "2"
        USE_MPI: "NO"
        SLURM_JOB_NUM_NODES: "2"
        SLURM_NTASKS: "8"
