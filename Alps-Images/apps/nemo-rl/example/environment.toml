image = "jfrog.svc.cscs.ch/docker-group-csstaff/alps-images/nemo-rl-cuda:alps7-dev-cfcfede4262bfb99f4659aad30992344"
mounts = ["/capstor/", "/iopsstor/", "/ritom/", "${HOME}:${HOME}"]
workdir = "/tmp"
writable = true

[env]
