math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      url: ${oc.env:GYM_MATH_URL}
      host: gym-dev.swissai.svc.cscs.ch
      port: 443
      should_use_judge: false
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
      domain: math
      verified: false
      description: Remote math verification

math_with_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
