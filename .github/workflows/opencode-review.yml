name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: opencode-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          CSCS_INFERENCE_API_KEY: ${{ secrets.CSCS_INFERENCE_KEY }}
        with:
          model: cscs/moonshotai/Kimi-K2.7-Code
          agent: grumpy-reviewer
          share: false
          
      - name: Debug agent discovery
        if: always()
        run: |
          echo "=== .opencode tree ==="
          find .opencode -type f 2>/dev/null || echo "NO .opencode DIR"
          echo "=== frontmatter ==="
          head -20 .opencode/agents/grumpy-reviewer.md 2>/dev/null || echo "FILE NOT FOUND"
          echo "=== agents opencode sees ==="
          opencode agent list || echo "agent list failed"
          echo "=== config as loaded ==="
          jq -r '.agent // "no agent block"' opencode.json