name: opencode-review

on:
  # Conversation comments use the default-branch workflow and can target fork PRs.
  issue_comment:
    types: [created]

# Allow the worker to read PR data, react to requests, and post the final comment.
# Its acknowledge, review, and publish jobs restrict these permissions separately.
permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  authorize:
    # Ignore non-PR comments, bots, and comments whose author differs from the event actor.
    # A matching prefix is only a filter; the access-check step below validates the command.
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      github.actor == github.event.comment.user.login &&
      startsWith(github.event.comment.body, '/oc-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job checks access but has no inference key or permission to post comments.
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.access.outputs.authorized }}
    steps:
      # Load authorization code from the target repository's default branch, not the PR.
      - name: Checkout trusted authorization helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch
          persist-credentials: false
      # Query the author's current repository permission.
      # Write and admin qualify; GitHub reports maintain as write.
      # Noncommands and users without write access return authorized=false.
      # A missing collaborator counts as no access; other API errors fail this job.
      - name: Check repository write access
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 default-branch/.github/review/host/context.py authorize \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

  review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    # Only an authorized request can cancel an earlier review for the same PR.
    # Reviews for other PRs use different concurrency groups.
    concurrency:
      group: opencode-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    # Use the worker from main, so changes to the worker in the PR are not executed.
    uses: eth-cscs/alps-extended-images/.github/workflows/opencode-review-worker.yml@main
    # Forward only the inference key; the worker pulls its image without registry credentials.
    secrets:
      CSCS_INFERENCE_KEY: ${{ secrets.CSCS_INFERENCE_KEY }}