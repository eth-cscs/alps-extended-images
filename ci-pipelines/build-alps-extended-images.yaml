cleanup-dev-ghcr:
  stage: cleanup
  image: python:3.12-slim
  extends: [.container-runner-lightweight-gh200]
  timeout: 2h
  allow_failure: false
  variables:
    KUBERNETES_MEMORY_REQUEST: '4Gi'
    KUBERNETES_MEMORY_LIMIT: '4Gi'
    DELETE_DEV_GHCR: 'delete'
  script:
    - |
      set -euo pipefail
      : "${GITHUB_TOKEN:?GITHUB_TOKEN must be set}"
      if [[ "${DELETE_DEV_GHCR}" != "dry-run" && "${DELETE_DEV_GHCR}" != "delete" ]]; then
        echo "ERROR: set DELETE_DEV_GHCR=dry-run or DELETE_DEV_GHCR=delete when starting this manual cleanup job" >&2
        exit 1
      fi

      python - <<'PY'
      from __future__ import annotations

      import json
      import os
      import sys
      import time
      import urllib.error
      import urllib.parse
      import urllib.request

      owner = "eth-cscs"
      package_names = [
          "alps-extended-images/ngc-pytorch",
          "alps-extended-images/ngc-nemo",
          "alps-extended-images/ngc-physicsnemo",
          "alps-extended-images/apertus-2",
          "alps-extended-images/apertus-1p5",
          "alps-extended-images/verl",
          "alps-extended-images/sfttrainer",
          "alps-extended-images/vllm",
      ]
      token = os.environ["GITHUB_TOKEN"]
      delete_enabled = os.environ["DELETE_DEV_GHCR"] == "delete"
      headers = {
          "Accept": "application/vnd.github+json",
          "Authorization": f"Bearer {token}",
          "X-GitHub-Api-Version": "2022-11-28",
      }

      def request(method: str, url: str) -> tuple[int, object | None, dict[str, str]]:
          req = urllib.request.Request(url, method=method, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = response.read()
                  data = json.loads(body) if body else None
                  return response.status, data, dict(response.headers)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              raise RuntimeError(f"GitHub API {method} {url} failed: HTTP {exc.code}: {body}") from exc

      def list_versions(package_name: str) -> list[dict]:
          encoded = urllib.parse.quote(package_name, safe="")
          url = f"https://api.github.com/orgs/{owner}/packages/container/{encoded}/versions?per_page=100"
          versions: list[dict] = []
          while url:
              _, data, response_headers = request("GET", url)
              if not isinstance(data, list):
                  raise RuntimeError(f"unexpected response for {package_name}: {data!r}")
              versions.extend(data)
              links = response_headers.get("Link", "")
              next_url = ""
              for part in links.split(","):
                  if 'rel="next"' in part:
                      next_url = part[part.find("<") + 1:part.find(">")]
                      break
              url = next_url
          return versions

      failures = 0
      deleted = 0
      for package_name in package_names:
          print(f"## {package_name}")
          versions = list_versions(package_name)
          for version in versions:
              tags = version.get("metadata", {}).get("container", {}).get("tags", [])
              dev_tags = [tag for tag in tags if tag.endswith("-dev")]
              if not dev_tags:
                  continue
              stable_tags = [tag for tag in tags if not tag.endswith("-dev")]
              if stable_tags:
                  print(f"ERROR: refusing to delete version {version['id']} with mixed tags: {tags}", file=sys.stderr)
                  failures += 1
                  continue
              encoded = urllib.parse.quote(package_name, safe="")
              url = f"https://api.github.com/orgs/{owner}/packages/container/{encoded}/versions/{version['id']}"
              if delete_enabled:
                  print(f"DELETE version {version['id']}: {', '.join(dev_tags)}")
                  request("DELETE", url)
                  deleted += 1
                  time.sleep(2)
              else:
                  print(f"WOULD DELETE version {version['id']}: {', '.join(dev_tags)}")

      if failures:
          raise SystemExit(failures)
      if delete_enabled:
          print(f"Deleted {deleted} GHCR dev package versions")
      else:
          print("Dry run complete; rerun with DELETE_DEV_GHCR=delete to delete listed versions")
      PY
