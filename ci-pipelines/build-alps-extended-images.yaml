include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages: [dry-run, migrate]

variables:
  GHCR_IMAGE_PREFIX: ghcr.io/eth-cscs/alps-extended-images
  JFROG_IMAGE_PREFIX: jfrog.svc.cscs.ch/docker-group-csstaff/alps-images

.migration-template:
  image: quay.io/skopeo/stable:latest
  extends: [.container-runner-lightweight-gh200]
  before_script:
    - |
      set -euo pipefail
      : "${JFROG_USER:?JFROG_USER must be set}"
      : "${JFROG_KEY:?JFROG_KEY must be set}"
      : "${GITHUB_ACTOR:?GITHUB_ACTOR must be set}"
      : "${GITHUB_TOKEN:?GITHUB_TOKEN must be set}"
      echo "login to: ghcr.io with user: ${GITHUB_ACTOR}"
      skopeo login --username "${GITHUB_ACTOR}" --password "${GITHUB_TOKEN}" ghcr.io >/dev/null
      echo "login to: jfrog.svc.cscs.ch with user: ${JFROG_USER}"
      skopeo login --username "${JFROG_USER}" --password "${JFROG_KEY}" jfrog.svc.cscs.ch >/dev/null
  script:
    - |
      set -euo pipefail

      if [[ "${MIGRATION_MODE}" == "copy" && "${CONFIRM_MIGRATION:-}" != "copy" ]]; then
        echo "ERROR: set CONFIRM_MIGRATION=copy when starting the manual migration job" >&2
        exit 1
      fi

      img_digest() {
        skopeo inspect --format '{{.Digest}}' "docker://$1" 2>/dev/null || true
      }

      copy_or_check() {
        local registry_prefix="${1:?registry prefix required}"
        local old_image="${2:?old image required}"
        local new_image="${3:?new image required}"
        local tag="${4:?tag required}"
        local mode="${5:?mode required}"
        local src="${registry_prefix}/${old_image}:${tag}"
        local dst="${registry_prefix}/${new_image}:${tag}"
        local src_digest dst_digest

        src_digest="$(img_digest "${src}")"
        if [[ -z "${src_digest}" ]]; then
          echo "ERROR: source image is missing: ${src}" >&2
          return 1
        fi

        dst_digest="$(img_digest "${dst}")"
        if [[ -n "${dst_digest}" ]]; then
          if [[ "${dst_digest}" == "${src_digest}" ]]; then
            echo "NO-OP: ${dst} already points to ${src_digest}"
            return 0
          fi
          echo "ERROR: destination exists with different digest: ${dst}" >&2
          echo "  source:      ${src_digest}" >&2
          echo "  destination: ${dst_digest}" >&2
          return 1
        fi

        if [[ "${mode}" == "copy" ]]; then
          echo "COPY: ${src} -> ${dst} (${src_digest})"
          skopeo copy "docker://${src}" "docker://${dst}"
        else
          echo "WOULD COPY: ${src} -> ${dst} (${src_digest})"
        fi
      }

      run_migration() {
        local mode="${1:?mode required}"
        local old_image new_image tag

        while read -r old_image new_image tag; do
          [[ -n "${old_image}" ]] || continue
          [[ "${old_image}" != \#* ]] || continue
          copy_or_check "${GHCR_IMAGE_PREFIX}" "${old_image}" "${new_image}" "${tag}" "${mode}"
          copy_or_check "${JFROG_IMAGE_PREFIX}" "${old_image}" "${new_image}" "${tag}" "${mode}"
        done <<'EOF'
      ngc-pytorch pytorch-cuda 25.12-py3-alps4
      ngc-pytorch pytorch-cuda 26.01-py3-alps4
      ngc-pytorch pytorch-cuda 26.02-py3-alps4
      ngc-nemo nemo-cuda 25.11.01-alps4
      ngc-nemo nemo-cuda 26.02-alps4
      ngc-physicsnemo physicsnemo-cuda 25.11-alps4
      apertus-2 apertus-2-cuda alps4
      apertus-1p5 apertus-1p5-cuda alps4

      ngc-pytorch pytorch-cuda 25.12-py3-alps5
      ngc-pytorch pytorch-cuda 26.01-py3-alps5
      ngc-pytorch pytorch-cuda 26.02-py3-alps5
      ngc-nemo nemo-cuda 25.11.01-alps5
      ngc-nemo nemo-cuda 26.02-alps5
      ngc-physicsnemo physicsnemo-cuda 25.11-alps5
      apertus-2 apertus-2-cuda alps5
      apertus-1p5 apertus-1p5-cuda alps5
      sfttrainer sfttrainer-cuda alps5
      verl verl-cuda alps5

      ngc-pytorch pytorch-cuda 25.12-py3-alps6
      ngc-pytorch pytorch-cuda 26.01-py3-alps6
      ngc-pytorch pytorch-cuda 26.02-py3-alps6
      ngc-nemo nemo-cuda 25.11.01-alps6
      ngc-nemo nemo-cuda 26.02-alps6
      ngc-physicsnemo physicsnemo-cuda 25.11-alps6
      apertus-2 apertus-2-cuda alps6
      apertus-1p5 apertus-1p5-cuda alps6
      sfttrainer sfttrainer-cuda alps6
      verl verl-cuda alps6
      EOF
      }

      run_migration "${MIGRATION_MODE}"

dry-run-image-name-migration:
  stage: dry-run
  extends: [.migration-template]
  variables:
    MIGRATION_MODE: check

migrate-image-names:
  stage: migrate
  extends: [.migration-template]
  needs:
    - dry-run-image-name-migration
  variables:
    MIGRATION_MODE: copy
    CONFIRM_MIGRATION: ""
