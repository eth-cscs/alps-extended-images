# ----------------------------
# Publish
# ----------------------------
# Upload the images to the registry with stable tags under certain conditions:
# - All tests must have executed and passed (enforced by the "needs:"
#   dependency on the test jobs in the publish-gate job)
# - The commit must be on the default branch (enforced in the script with a
#   check on CI_COMMIT_BRANCH)
# - The stable tag must not already exist with different content (enforced by
#   promote_check_strict)
# Note: Skopeo copy requires a larger memory limit.
#       Therfore we are using the container-builder-cscs-gh200 worker that comes with the skopeo tool kit.
publish-gate:
  stage: publish
  extends: [.container-runner-lightweight-gh200, .skopeo-template]
  # make sure to keep the "needs" up to date when adding new test jobs
  needs:
    - test-cuda-base-images-env
    - test-cuda-base-images-collectives
    - test-cuda-base-images-vetnode
    - test-rocm-base-images-env
    - test-rocm-base-images-collectives
    - test-apertus-1p5
    - test-apertus-2-pplx-garden
    - test-apertus-2-DeepEP
    - test-vllm-ray-nccl
    - test-vllm-rocm-ray-rccl
    - test-cuda-app-images-vetnode
    #- test-verl-async
  script:
    - echo "Publish gate passed (tests completed)"

.publish-template:
  stage: publish
  extends: [.container-builder-cscs-gh200]
  variables:
    KUBERNETES_MEMORY_REQUEST: 128Gi
    KUBERNETES_MEMORY_LIMIT: 128Gi
  script:
    - |
      source ci-pipelines/helpers/skopeo.sh
      skopeo_login
      skopeo_login_ghcr
      set -euo pipefail

      echo "Starting promotion process for $CANON_IMAGE_REF"

      if [[ "${ALPS_REV}" =~ -dev$ ]]; then
        # For dev versions, we allow non-strict promotion (overwrites stable
        # tag regardless of content) but only on the default branch
        if [[ "${CI_COMMIT_BRANCH}" == "${CI_DEFAULT_BRANCH}" ]]; then
          echo "copy to: $STABLE_IMAGE_REF"
          skopeo copy "$(_ref_url "$CANON_IMAGE_REF")" "$(_ref_url "$STABLE_IMAGE_REF")"
          echo "copy to: $GHCR_STABLE_IMAGE_REF"
          skopeo copy  "$(_ref_url "$CANON_IMAGE_REF")" "$(_ref_url "$GHCR_STABLE_IMAGE_REF")"
          echo "Promotion successful (dev version): $CANON_IMAGE_REF -> $STABLE_IMAGE_REF -> $GHCR_STABLE_IMAGE_REF"
        else
          echo "Dry-run only (dev version detected and not default branch): promotion not executed."
        fi
      else
        # Always run strict check (fails if stable exists but differs)
        echo "Publish check: $CANON_IMAGE_REF -> $STABLE_IMAGE_REF"
        promote_check_strict "$CANON_IMAGE_REF" "$STABLE_IMAGE_REF"
        # Only promote on default branch
        if [[ "${CI_COMMIT_BRANCH}" == "${CI_DEFAULT_BRANCH}" ]]; then
          promote_strict "$CANON_IMAGE_REF" "$STABLE_IMAGE_REF"
          promote_strict "$CANON_IMAGE_REF" "$GHCR_STABLE_IMAGE_REF"
          echo "Promotion successful: $CANON_IMAGE_REF -> $STABLE_IMAGE_REF -> $GHCR_STABLE_IMAGE_REF"
        else
          echo "Dry-run only (not default branch): promotion not executed."
        fi
      fi

publish-cuda-base-images:
  extends: [.publish-template]
  parallel:
    matrix: *cuda_base_images_matrix
  needs:
    - job: publish-gate
    - job: build-cuda-base-meta
      artifacts: true
      <<: *cuda_base_needs_map

publish-rocm-base-images:
  extends: [.publish-template]
  parallel:
    matrix: *rocm_base_images_matrix
  needs:
    - job: publish-gate
    - job: build-rocm-base-meta
      artifacts: true
      <<: *rocm_base_needs_map

publish-cuda-app-images:
