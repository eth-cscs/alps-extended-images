include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

# Hidden templates consumed by generated-child-pipeline.yaml.
#
# The generator emits concrete jobs with only the variables and dependencies
# needed for the current registry state. These templates keep runner selection,
# common build/test scripts, and promotion policy in one static file so generated
# jobs stay small and reviewable.
#
# Stage flow:
# - build-base: build missing canonical base images
# - test-base: test bases whose validation marker is missing/stale
# - mark-base-tested: retag tested bases to validation-marker refs
# - build-apps: build missing canonical app images after their bases validate
# - test-apps: test apps whose validation marker is missing/stale
# - mark-app-tested: retag tested apps to validation-marker refs
# - publish: promote only validated images to stable/JFrog/GHCR refs

# CSCS recipes provide a GH200 builder template, but not an equivalent MI300
# builder.
.container-builder-cscs-mi300:
  extends: [.f7t-runner, .beverin]
  interruptible: true
  script:
    - build_new_container
  variables:
    CSCS_RUNNER_MODE: 'container-builder'
    CSCS_REBUILD_POLICY: "if-not-exists"
    FIRECREST_SYSTEM: 'beverin'
    SLURM_PARTITION: mi300
    SLURM_TIMELIMIT: '04:00:00'

# Registry-operation setup used by marker and publish jobs.
.child-skopeo-template:
  image: quay.io/skopeo/stable:latest
  before_script:
    - source ci-pipelines/helpers/skopeo.sh
    - skopeo_login
    - skopeo_login_ghcr

# Used when the generator found no build, validation, or publish work.
.child-noop-template:
  stage: build-base
  extends: [.container-runner-lightweight-gh200]
  image: quay.io/skopeo/stable:latest
  script:
    - echo "No work required."

# Common Slurm defaults for generated image test jobs. Generated test jobs set
# `image:` to the canonical ref and only appear when validation is missing/stale.
.child-slurm-template:
  variables:
    USE_MPI: NO
    SLURM_MPI_TYPE: pmix
    SLURM_NETWORK: disable_rdzv_get
    PMIX_MCA_psec: native

# Common build wrapper for generated build jobs. The generated job provides the
# canonical target ref and selected Dockerfile/build args; the CSCS builder
# helper reads these variables and performs the podman build/push.
.child-build-images-template:
  variables:
    CUSTOM_REGISTRY_USERNAME: $JFROG_USER
    CUSTOM_REGISTRY_PASSWORD: $JFROG_KEY
    CSCS_REBUILD_POLICY: if-not-exists
    CSCS_BUILD_CACHE: $CSCS_REGISTRY_PATH/build_cache
    KUBERNETES_MEMORY_REQUEST: '400Gi'
    KUBERNETES_MEMORY_LIMIT: '400Gi'
  before_script:
    - |
      set -euo pipefail
      export PERSIST_IMAGE_NAME="$CANON_IMAGE_REF"
      echo "Building: $PERSIST_IMAGE_NAME"
  timeout: 6h

# CUDA base build: NGC image plus Alps CUDA/HPC stack.
.child-cuda-base-build-template:
  stage: build-base
  extends: [.container-builder-cscs-gh200, .child-build-images-template]
  variables:
    DOCKER_BUILD_ARGS: '[
      "BASE_IMAGE",
      "NGC_VARIANT_DIR",
      "REMOVE_HPCX_DIRS",
      "BOOST_VER",
      "BOOST_BUILD_JOBS",
      "ALPS_BUILD_JOBS",
      "ALPS_CMAKE_BUILD_JOBS",
      "XPMEM_REF",
      "CASSINI_HEADERS_VERSION",
      "CXI_DRIVER_VERSION",
      "LIBCXI_VERSION",
      "LIBFABRIC_COMMIT",
      "LIBFABRIC_PATCH",
      "UCX_VERSION",
      "UCC_VERSION",
      "OMPI_VER",
      "AWS_OFI_NCCL_REPO",
      "AWS_OFI_NCCL_COMMIT",
      "AWS_OFI_NCCL_PATCH",
      "OSU_VERSION",
      "OCI_SOURCE",
      "OCI_REVISION",
      "OCI_CREATED",
      "OCI_DESCRIPTION",
      "CSCS_ALPS_GIT_COMMIT_SHORT"
    ]'

# ROCm base build: ROCm image plus Alps ROCm/HPC stack.
.child-rocm-base-build-template:
  stage: build-base
  extends: [.container-builder-cscs-mi300, .child-build-images-template]
  variables:
    DOCKER_BUILD_ARGS: '[
      "BASE_IMAGE",
      "ROCM_VARIANT_DIR",
      "ROCM_VERSION",
      "ROCM_REBUILD_RCCL",
      "ROCM_SYSTEMS_REPO",
      "ROCM_SYSTEMS_COMMIT",
      "RCCL_GPU_TARGETS",
      "RCCL_TESTS_GPU_TARGETS",
      "ROCM_PYPI_INDEX_URL",
      "BOOST_VER",
      "BOOST_BUILD_JOBS",
      "ALPS_BUILD_JOBS",
      "ALPS_CMAKE_BUILD_JOBS",
      "XPMEM_REF",
      "CASSINI_HEADERS_VERSION",
      "CXI_DRIVER_VERSION",
      "LIBCXI_VERSION",
      "LIBFABRIC_COMMIT",
      "LIBFABRIC_PATCH",
      "UCX_VERSION",
      "UCC_VERSION",
      "OMPI_VER",
      "AWS_OFI_NCCL_REPO",
      "AWS_OFI_NCCL_COMMIT",
      "AWS_OFI_NCCL_PATCH",
      "OSU_VERSION",
      "OCI_SOURCE",
      "OCI_REVISION",
      "OCI_CREATED",
      "OCI_DESCRIPTION",
      "CSCS_ALPS_GIT_COMMIT_SHORT"
    ]'

# CUDA app build on top of the selected canonical CUDA base image.
.child-cuda-app-build-template:
  stage: build-apps
  extends: [.container-builder-cscs-gh200, .child-build-images-template]
  variables:
    DOCKER_BUILD_ARGS: '[
      "BASE_IMAGE",
      "OCI_SOURCE",
      "OCI_REVISION",
      "OCI_CREATED",
      "OCI_DESCRIPTION",
      "CSCS_ALPS_GIT_COMMIT_SHORT"
    ]'

# ROCm app build on top of the selected canonical ROCm base image.
.child-rocm-app-build-template:
  stage: build-apps
  extends: [.container-builder-cscs-mi300, .child-build-images-template]
  variables:
    DOCKER_BUILD_ARGS: '[
      "BASE_IMAGE",
      "OCI_SOURCE",
      "OCI_REVISION",
      "OCI_CREATED",
      "OCI_DESCRIPTION",
      "CSCS_ALPS_GIT_COMMIT_SHORT"
    ]'

# CUDA base environment variable smoke test.
.child-cuda-base-env-test-template:
  stage: test-base
  extends: [.container-runner-clariden-gh200, .child-slurm-template]
  script:
    - |
      set -euo pipefail
      test "${FI_PROVIDER:-}" = "cxi"
      test "${FI_CXI_RDZV_PROTO:-}" = "alt_read"
      test "${NCCL_NET:-}" = "AWS Libfabric"
      test "${NCCL_PROTO:-}" = "^LL128"
      test "${NVSHMEM_REMOTE_TRANSPORT:-}" = "libfabric"
      test "${NVSHMEM_LIBFABRIC_PROVIDER:-}" = "cxi"
      test "${NCCL_VERSION:-}" = "dummy"
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
    NCCL_VERSION: dummy

# CUDA base multi-node collectives and MPI smoke test.
.child-cuda-base-collectives-test-template:
  stage: test-base
  extends: [.container-runner-clariden-gh200, .child-slurm-template]
  script:
    - alltoall_perf -b 32 -e 4M -f 2 -g 1
    - FI_CXI_ENABLE_WRITEDATA=1 OFI_NCCL_PROTOCOL=RDMA sendrecv_perf -b 32 -e 4M -f 2 -g 1
    - /opt/nvshmem/bin/perftest/device/coll/alltoall_latency --datatype float -b 32 -e 4194304 -f 2
    - /usr/local/libexec/osu-micro-benchmarks/mpi/collective/osu_alltoall --type mpi_float --message-size 32:2^22:2 --full --tail-lat --accelerator cuda
  variables:
    SLURM_JOB_NUM_NODES: 2
    SLURM_NTASKS: 8

# CUDA base hardware/software diagnosis via vetnode.
.child-cuda-vetnode-test-template:
  stage: test-base
  extends: [.container-runner-clariden-gh200, .child-slurm-template]
  script:
    - echo "[image-vet] Set-up vetnode on $(hostname)... "
    - |
      config=$(realpath ci-pipelines/helpers/vetnode-config.yaml)
      tmp_dir="/tmp"
      venv="$tmp_dir/.venv-${SLURM_NODEID}-${SLURM_JOB_ID}"
      done_file="$tmp_dir/setup-done-${SLURM_NODEID}-${SLURM_JOB_ID}"
      cd "$tmp_dir"
      if [ "$SLURM_LOCALID" -eq 0 ]; then
        python -m venv --system-site-packages "$venv"
        source "$venv/bin/activate"
        pip install --no-cache-dir --index-url "https://jfrog.svc.cscs.ch/artifactory/api/pypi/pypi-remote/simple" vetnode
        vetnode setup "$config"
        touch "$done_file"
      else
        echo "[image-vet] Waiting for setup on $(hostname)..."
        timeout=60
        while [ ! -f "$done_file" ] && [ $timeout -gt 0 ]; do
            sleep 1
            ((timeout--))
        done
      fi
    - echo "[image-vet] diagnose"
    - source "$venv/bin/activate"
    - vetnode diagnose "$config"
  variables:
    SLURM_JOB_NUM_NODES: 4
    SLURM_NTASKS: 16
    GIT_STRATEGY: fetch

# App variant of the CUDA vetnode test, emitted in the app test stage.
.child-cuda-app-vetnode-test-template:
  extends: [.child-cuda-vetnode-test-template]
  stage: test-apps
  timeout: 2h

# ROCm base environment and PyTorch device visibility smoke test.
.child-rocm-base-env-test-template:
  stage: test-base
  extends: [.container-runner-beverin-mi300, .child-slurm-template]
  script:
    - |
      set -euo pipefail
      test "${FI_PROVIDER:-}" = "cxi"
      test "${FI_CXI_RDZV_PROTO:-}" = "alt_read"
      test "${NCCL_NET:-}" = "AWS Libfabric"
      test "${NCCL_PROTO:-}" = "^LL128"
      test -n "${ROCM_VERSION:-}"
      test -n "${RCCL_VERSION:-}"
      /opt/venv/bin/python - <<'PY'
      import amdsmi
      import torch
      assert torch.cuda.is_available(), "ROCm device is not visible to PyTorch"
      print("amdsmi import ok")
      print(torch.cuda.get_device_name(0))
      PY
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1

# ROCm base multi-node RCCL and MPI smoke test.
.child-rocm-base-collectives-test-template:
  stage: test-base
  extends: [.container-runner-beverin-mi300, .child-slurm-template]
  script:
    - all_reduce_perf -b 32 -e 4M -f 2 -g 1
    - /usr/local/libexec/osu-micro-benchmarks/mpi/collective/osu_alltoall --type mpi_float --message-size 32:2^22:2 --full --tail-lat --accelerator rocm
  variables:
    SLURM_JOB_NUM_NODES: 2
    SLURM_NTASKS: 8

# CUDA app test template; generated jobs provide the script.
.child-cuda-custom-test-template:
  stage: test-apps
  extends: [.container-runner-clariden-gh200, .child-slurm-template]

# ROCm app test template; generated jobs provide the script.
.child-rocm-custom-test-template:
  stage: test-apps
  extends: [.container-runner-beverin-mi300, .child-slurm-template]

# Marker jobs copy the already-tested canonical image digest to a synthetic tag:
# <canonical-tag>-tested-<validation-hash>.

# Base-image marker job.
.child-mark-base-tested-template:
  stage: mark-base-tested
  extends: [.container-runner-lightweight-gh200, .child-skopeo-template]
  script:
    - mark_tested "$CANON_IMAGE_REF" "$TESTED_IMAGE_REF"

# App-image marker job.
.child-mark-app-tested-template:
  stage: mark-app-tested
  extends: [.container-runner-lightweight-gh200, .child-skopeo-template]
  script:
    - mark_tested "$CANON_IMAGE_REF" "$TESTED_IMAGE_REF"

# Publish jobs are emitted only when a stable destination differs from the
# canonical digest. They re-check the tested marker before copying, so promotion
# stays safe even if registry state changed after generation.
.child-publish-template:
  stage: publish
  extends: [.container-builder-cscs-gh200]
  variables:
    KUBERNETES_MEMORY_REQUEST: 128Gi
    KUBERNETES_MEMORY_LIMIT: 128Gi
  script:
    - |
      source ci-pipelines/helpers/skopeo.sh
      skopeo_login
      skopeo_login_ghcr
      set -euo pipefail

      # Both $CANON_IMAGE_REF and $TESTED_IMAGE_REF must exist and point to the
      # same digest.
      require_tested_marker_valid "$CANON_IMAGE_REF" "$TESTED_IMAGE_REF"

      echo "Starting promotion process for $CANON_IMAGE_REF"
      if [[ "${ALPS_REV}" =~ -dev$ ]]; then
        # Case: dev version
        if [[ "${CI_COMMIT_BRANCH}" == "${CI_DEFAULT_BRANCH}" ]]; then
          echo "copy to: $STABLE_IMAGE_REF"
          skopeo copy "$(_ref_url "$CANON_IMAGE_REF")" "$(_ref_url "$STABLE_IMAGE_REF")"
          echo "copy to: $GHCR_STABLE_IMAGE_REF"
          skopeo copy "$(_ref_url "$CANON_IMAGE_REF")" "$(_ref_url "$GHCR_STABLE_IMAGE_REF")"
          echo "Promotion successful (dev version): $CANON_IMAGE_REF -> $STABLE_IMAGE_REF -> $GHCR_STABLE_IMAGE_REF"
        else
          echo "Dry-run only (dev version detected and not default branch): promotion not executed."
        fi
      else
        # Case: stable version
        echo "Publish check: $CANON_IMAGE_REF -> $STABLE_IMAGE_REF"
        promote_check_strict "$CANON_IMAGE_REF" "$STABLE_IMAGE_REF"
        if [[ "${CI_COMMIT_BRANCH}" == "${CI_DEFAULT_BRANCH}" ]]; then
          promote_strict "$CANON_IMAGE_REF" "$STABLE_IMAGE_REF"
          promote_strict "$CANON_IMAGE_REF" "$GHCR_STABLE_IMAGE_REF"
          echo "Promotion successful: $CANON_IMAGE_REF -> $STABLE_IMAGE_REF -> $GHCR_STABLE_IMAGE_REF"
        else
          echo "Dry-run only (not default branch): promotion not executed."
        fi
      fi
